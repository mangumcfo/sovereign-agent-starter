# Capability card — Self-held node identity (D1 keystore)
# Machine-readable twin of identity-keystore.md. Source of truth: PRESENT/callable sealed floors only.
id: identity-keystore
name: "Self-held node identity (D1 keystore)"
sealed_home: "D1 keystore — Sovereign Peerhood (Series 14) substrate"
callable_path: "sovereign_agent.keystore.node_keystore"
verbs:
    - "generate_node_key"
    - "load_node_key"
    - "load_node_keypair"
    - "sign_node_act"
    - "verify_node_act"
    - "node_fingerprint"
    - "has_node_key"
inputs: "keystore_dir, node_id, payload bytes (to sign), public_hex + sig_hex (to verify)"
outputs: "NodeKey{public_hex, fingerprint} · signature hex · verify -> bool"
gate_required: "N"
receipt_shape: "NodeKey(public_hex, fingerprint); sign -> hex signature; verify_node_act -> bool; stable fingerprint across reload"
kill_targets:
    - "no custodian / escrow / KMS / seal-key field (refused)"
    - "no key minted before the sovereign's own act"
    - "fail-loud if the key is absent — never a silent stub"
anti_patterns:
    - "app stores or transmits the private key"
    - "a cloud service holds the key 'for convenience'"
    - "a recovery service that can reconstruct the key"
app_patterns:
    - "derive the node's stable identity for your app's session"
    - "sign an app action so a third party can verify it without you"
    - "verify a counterparty's signed act offline, no account"
